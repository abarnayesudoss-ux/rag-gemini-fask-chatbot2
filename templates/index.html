<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_title }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }
        .app {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
            overflow: hidden;
        }
        header {
            padding: 22px;
            background: #1f4ed8;
            color: white;
        }
        header h1 { margin: 0 0 6px; font-size: 24px; }
        header p { margin: 0; opacity: .9; }
        .upload {
            padding: 16px 20px;
            border-bottom: 1px solid #e8ebf2;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="file"] {
            flex: 1;
            min-width: 220px;
        }
        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 600;
        }
        #uploadBtn { background: #e8efff; color: #1f4ed8; }
        .messages {
            height: 430px;
            overflow-y: auto;
            padding: 20px;
        }
        .msg {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 14px;
            margin: 9px 0;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .bot {
            background: #eef2f8;
            margin-right: auto;
        }
        .user {
            background: #1f4ed8;
            color: white;
            margin-left: auto;
        }
        .composer {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #e8ebf2;
        }
        #message {
            flex: 1;
            padding: 13px;
            border: 1px solid #d5dbe7;
            border-radius: 10px;
            outline: none;
        }
        #sendBtn { background: #1f4ed8; color: white; }
        #status {
            width: 100%;
            font-size: 13px;
            color: #596579;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="card">
        <header>
            <h1>📚 {{ chatbot_title }}</h1>
            <p>Upload PDF, DOCX or TXT files and ask questions from them.</p>
        </header>

        <div class="upload">
            <input id="file" type="file" accept=".pdf,.docx,.txt">
            <button id="uploadBtn">Upload Document</button>
            <div id="status"></div>
        </div>

        <div id="messages" class="messages">
            <div class="msg bot">Hi! Upload a document and ask me a question.</div>
        </div>

        <div class="composer">
            <input id="message" type="text" placeholder="Ask a question from your document...">
            <button id="sendBtn">Send</button>
        </div>
    </div>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("message");
const statusBox = document.getElementById("status");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

document.getElementById("uploadBtn").onclick = async () => {
    const file = document.getElementById("file").files[0];
    if (!file) {
        statusBox.textContent = "Please select a PDF, DOCX or TXT file.";
        return;
    }

    const formData = new FormData();
    formData.append("file", file);
    statusBox.textContent = "Uploading...";

    const response = await fetch("/upload", {
        method: "POST",
        body: formData
    });
    const data = await response.json();
    statusBox.textContent = data.message || data.error || "Upload completed.";
};

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    addMessage("Thinking...", "bot");
    const thinking = messages.lastElementChild;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: text})
        });
        const data = await response.json();
        thinking.textContent = data.reply || "No response.";
    } catch (error) {
        thinking.textContent = "Unable to connect to the server.";
    }
}

document.getElementById("sendBtn").onclick = sendMessage;
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
